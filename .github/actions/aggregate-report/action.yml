name: Aggregate report
description: >
  Merge all result artifacts into one pass/fail matrix, explain each failure
  and how to fix it, and gate on FAIL. The calling job must check out the
  repository first (the fix hints come from tests/*/manifest.tsv).
inputs:
  labels:
    description: Comma-separated runner labels the run selected; any without results is reported
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Download results
      uses: actions/download-artifact@v8
      with:
        pattern: result-*
        path: raw
    - name: Summarize and gate
      shell: bash
      env:
        SELECTED_LABELS: ${{ inputs.labels }}
      run: python3 "$GITHUB_ACTION_PATH/summarize.py"
    - name: Upload summary
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: summary
        path: summary.csv
        retention-days: 30
