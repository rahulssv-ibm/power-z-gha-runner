name: Aggregate report
description: Merge all result artifacts into one pass/fail matrix and gate on FAIL.
runs:
  using: composite
  steps:
    - name: Download results
      uses: actions/download-artifact@v8
      with:
        pattern: result-*
        path: raw
    - name: Summarize and gate
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/summarize.py"
    - name: Upload summary
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: summary
        path: summary.csv
        retention-days: 30
