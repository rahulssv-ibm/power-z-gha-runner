name: net10 runner test
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-24.04-ppc64le
    steps:
      - uses: actions/checkout@v7   # node24 JS action on ppc64le
      - name: Runner is on .NET 10
        run: |
          uname -m
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          # The step shell's parent is Runner.Worker, wherever the runner and work dir live
          worker=$(readlink -f /proc/$PPID/exe)
          echo "worker: $worker"
          grep -E '"(tfm|version)"' "$(dirname "$worker")/Runner.Worker.runtimeconfig.json"
          # .NET runtime the worker has actually loaded
          grep -oE '[^ ]*/Microsoft\.NETCore\.App/[0-9.]+' /proc/$PPID/maps | sort -u
