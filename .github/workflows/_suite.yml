name: _suite

on:
  workflow_call:
    inputs:
      domain:       { required: true, type: string }
      profile:      { required: true, type: string }   # container | vm | hosted
      # {"include": [{"label", "arch", "os", "instance"}, ...]}, built by run-all's plan job
      matrix:       { required: true, type: string }
      max_parallel: { required: false, type: string, default: "25" }

jobs:
  test:
    name: ${{ inputs.domain }} ${{ matrix.label }} #${{ matrix.instance }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-suite
        with:
          domain: ${{ inputs.domain }}
          profile: ${{ inputs.profile }}
          label: ${{ matrix.label }}
          arch: ${{ matrix.arch }}
          os: ${{ matrix.os }}
          instance: ${{ matrix.instance }}
