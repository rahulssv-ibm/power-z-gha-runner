name: _suite-container

on:
  workflow_call:
    inputs:
      domain:       { required: true, type: string }
      arch:         { required: true, type: string }
      os:           { required: true, type: string }
      instances:    { required: false, type: string, default: "1" }
      max_parallel: { required: false, type: string, default: "25" }

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
          OS: ${{ inputs.os }}
          INSTANCES: ${{ inputs.instances }}
        run: |
          python3 - "$ARCH" "$OS" "$INSTANCES" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          arch, osv, n = sys.argv[1], sys.argv[2], int(sys.argv[3])
          labels = [
            ("ubuntu-22.04-ppc64le-p10", "ppc64le", "22.04"),
            ("ubuntu-24.04-ppc64le-p10", "ppc64le", "24.04"),
            ("ubuntu-22.04-s390x", "s390x", "22.04"),
            ("ubuntu-24.04-s390x", "s390x", "24.04"),
          ]
          sel = [{"label": l, "arch": a, "os": o, "instance": i}
                 for l, a, o in labels if arch in ("all", a) and osv in ("all", o)
                 for i in range(1, n + 1)]
          if len(sel) > 256:
              sys.exit(f"{len(sel)} jobs exceeds GitHub's 256-per-matrix limit: narrow arch/os or lower instances")
          print("matrix=" + json.dumps({"include": sel}))
          PY

  test:
    needs: setup
    if: ${{ fromJSON(needs.setup.outputs.matrix).include[0] != null }}
    name: ${{ inputs.domain }} ${{ matrix.label }} #${{ matrix.instance }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-suite
        with:
          domain: ${{ inputs.domain }}
          profile: container
          arch: ${{ matrix.arch }}
          os: ${{ matrix.os }}
          instance: ${{ matrix.instance }}
